<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Play Chess with Mian Usman</title>
<meta name="description" content="Play a quick game of chess against Mian Usman's bot — instant, no reloads." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#232b36;
    --text:#e6edf3; --muted:#8b949e;
    --cyan:#22d3ee; --violet:#8a2be2;
    --sq-light:#8a94a6; --sq-dark:#3b4657;
    --sel:#8a2be2; --move:#22d3ee; --cap:#ff5a67; --check:#ff5a67;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 800px at 70% -10%, #17202b 0%, var(--bg) 60%);
    color:var(--text); font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 48px;
  }
  a{color:var(--cyan);text-decoration:none}
  .top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .brand{font-weight:700;font-size:1.05rem}
  .brand span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  .back{font-size:.85rem;color:var(--muted)}
  .back:hover{color:var(--cyan)}
  h1{font-size:1.5rem;margin-bottom:4px;text-align:center}
  .sub{color:var(--muted);font-size:.9rem;text-align:center;margin-bottom:16px}
  .status{
    font-family:'JetBrains Mono',monospace;font-size:.95rem;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 16px;margin-bottom:14px;min-width:280px;text-align:center;
  }
  .status.win{border-color:var(--cyan);color:var(--cyan)}
  .status.lose{border-color:var(--cap);color:var(--cap)}
  .board-wrap{
    width:min(92vw,520px);aspect-ratio:1/1;
    border-radius:14px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px var(--line);
  }
  .board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
  .sq{
    position:relative;display:flex;align-items:center;justify-content:center;
    font-size:min(9vw,52px);line-height:1;cursor:pointer;user-select:none;
    transition:background .12s;
  }
  .sq.light{background:var(--sq-light)}
  .sq.dark{background:var(--sq-dark)}
  .piece{position:relative;z-index:2;pointer-events:none}
  .piece.w{color:#f7fafc;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 1px #000}
  .piece.b{color:#12161c;text-shadow:0 1px 1px rgba(255,255,255,.25)}
  /* highlights */
  .sq.sel::after{content:"";position:absolute;inset:0;background:var(--sel);opacity:.45;z-index:1}
  .sq.last::after{content:"";position:absolute;inset:0;background:#e2c044;opacity:.28;z-index:0}
  .sq.check::after{content:"";position:absolute;inset:0;background:var(--check);opacity:.5;z-index:0}
  .dot{position:absolute;z-index:3;width:30%;height:30%;border-radius:50%;background:var(--move);opacity:.85}
  .ring{position:absolute;z-index:1;inset:8%;border-radius:50%;border:5px solid var(--cap);opacity:.85}
  .controls{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
  button{
    font-family:inherit;font-weight:600;font-size:.9rem;cursor:pointer;
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    padding:10px 18px;border-radius:10px;transition:.15s;
  }
  button:hover{border-color:var(--cyan);color:var(--cyan)}
  button.primary{background:linear-gradient(90deg,var(--cyan),var(--violet));color:#08111b;border:none}
  button.primary:hover{filter:brightness(1.08);color:#08111b}
  button:disabled{opacity:.5;cursor:not-allowed}
  .hint{color:var(--muted);font-size:.82rem;margin-top:14px;text-align:center;max-width:460px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">♟️ <span>Mian Usman</span> · Chess</div>
    <a class="back" href="https://github.com/UsmanShahab18">← back to profile</a>
  </div>

  <h1>Play me a game</h1>
  <p class="sub">You're <b>White</b> · the bot is <b>Black</b> · runs instantly, no reloads</p>

  <div class="status" id="status">Loading…</div>
  <div class="board-wrap"><div class="board" id="board"></div></div>

  <div class="controls">
    <button class="primary" id="newBtn">🔄 New Game</button>
    <button id="undoBtn">↩ Undo</button>
    <button id="flipBtn">⇅ Flip Board</button>
  </div>

  <p class="hint">Click one of your pieces to select it — legal moves show as cyan dots, captures as red rings. Click a highlighted square to move. The bot replies right away.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const GLYPH={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
const FILES=['a','b','c','d','e','f','g','h'];
const game=new Chess();
let selected=null, flipped=false, lastMove=null, busy=false;

const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');

function squareName(r,f){return FILES[f]+(8-r);}

function render(){
  boardEl.innerHTML='';
  const board=game.board();
  const rowOrder=flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];
  const colOrder=flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];
  const targets=selected?game.moves({square:selected,verbose:true}):[];
  const targetMap={};targets.forEach(m=>targetMap[m.to]=m);

  let checkSq=null;
  if(game.in_check()){
    const turn=game.turn();
    outer: for(let r=0;r<8;r++)for(let f=0;f<8;f++){
      const c=board[r][f];
      if(c&&c.type==='k'&&c.color===turn){checkSq=squareName(r,f);break outer;}
    }
  }

  for(const r of rowOrder){
    for(const f of colOrder){
      const sq=squareName(r,f);
      const cell=board[r][f];
      const d=document.createElement('div');
      d.className='sq '+(((r+f)%2===0)?'light':'dark');
      d.dataset.sq=sq;
      if(sq===selected)d.classList.add('sel');
      if(lastMove&&(sq===lastMove.from||sq===lastMove.to))d.classList.add('last');
      if(sq===checkSq)d.classList.add('check');
      if(cell){
        const p=document.createElement('span');
        p.className='piece '+cell.color;
        p.textContent=GLYPH[cell.type];
        d.appendChild(p);
      }
      if(targetMap[sq]){
        const mark=document.createElement('span');
        mark.className=cell?'ring':'dot';
        d.appendChild(mark);
      }
      d.addEventListener('click',()=>onClick(sq));
      boardEl.appendChild(d);
    }
  }
  updateStatus();
}

function updateStatus(){
  statusEl.className='status';
  if(game.in_checkmate()){
    if(game.turn()==='w'){statusEl.textContent='🏁 Checkmate — the bot wins. Try again!';statusEl.classList.add('lose');}
    else{statusEl.textContent='🏆 Checkmate — you win! 🎉';statusEl.classList.add('win');}
  }else if(game.in_stalemate()){statusEl.textContent='🤝 Stalemate — draw.';}
  else if(game.in_draw()){statusEl.textContent='🤝 Draw.';}
  else if(game.in_check()){statusEl.textContent=(game.turn()==='w'?'⚠️ You are in check!':'⚠️ Bot in check.');}
  else{statusEl.textContent=(game.turn()==='w'?'♟️ Your move (White).':'🤖 Bot is thinking…');}
}

function onClick(sq){
  if(busy||game.game_over())return;
  if(game.turn()!=='w')return;
  const piece=game.get(sq);
  if(selected){
    if(sq===selected){selected=null;render();return;}
    const legal=game.moves({square:selected,verbose:true}).some(m=>m.to===sq);
    if(legal){
      const cand=game.moves({square:selected,verbose:true}).filter(m=>m.to===sq);
      const mv=cand.find(m=>m.promotion==='q')||cand[0];
      game.move({from:selected,to:sq,promotion:mv.promotion?'q':undefined});
      lastMove={from:selected,to:sq};
      selected=null;render();
      if(!game.game_over())botTurn();
      return;
    }
    if(piece&&piece.color==='w'){selected=sq;render();return;}
    selected=null;render();
  }else if(piece&&piece.color==='w'){
    selected=sq;render();
  }
}

function botTurn(){
  busy=true;updateStatus();
  setTimeout(()=>{
    const moves=game.moves({verbose:true});
    if(moves.length){
      const val={p:1,n:3,b:3,r:5,q:9,k:0};
      let best=moves[0],score=-Infinity;
      for(const m of moves){
        let s=m.captured?val[m.captured]:0;
        if(m.san.includes('#'))s+=100;
        if(m.san.includes('+'))s+=0.4;
        s+=Math.random()*0.6;
        if(s>score){score=s;best=m;}
      }
      game.move(best);
      lastMove={from:best.from,to:best.to};
    }
    busy=false;render();
  },350);
}

document.getElementById('newBtn').addEventListener('click',()=>{game.reset();selected=null;lastMove=null;busy=false;render();});
document.getElementById('undoBtn').addEventListener('click',()=>{
  if(busy)return;
  game.undo();game.undo(); // undo bot + player
  selected=null;lastMove=null;render();
});
document.getElementById('flipBtn').addEventListener('click',()=>{flipped=!flipped;render();});

render();
</script>
</body>
</html>
